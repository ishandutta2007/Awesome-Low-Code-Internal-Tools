<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="chipGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Grid Filter -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#6366f1" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 0.5px;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient animated elements in background */
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.08); }
      100% { opacity: 0.25; transform: scale(1); }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
      100% { transform: translateY(0px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes beamMove {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-bg-1 {
      transform-origin: 200px 100px;
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .pulse-bg-2 {
      transform-origin: 1000px 250px;
      animation: pulseGlow 9s ease-in-out infinite;
    }
    .floating-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .data-beam {
      stroke-dasharray: 60 140;
      animation: beamMove 8s linear infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulse-bg-1" cx="180" cy="90" r="180" fill="#4f46e5" fill-opacity="0.18" filter="url(#glow)" />
  <circle class="pulse-bg-2" cx="1020" cy="270" r="200" fill="#ec4899" fill-opacity="0.14" filter="url(#glow)" />
  <circle cx="600" cy="340" r="160" fill="#06b6d4" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Animated Connection Flows / Data Beams behind main text -->
  <path class="data-beam" d="M 80,310 Q 300,340 500,280 T 950,290 T 1150,220" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.6" />
  <path class="data-beam" d="M 50,70 Q 350,20 650,90 T 1150,50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" style="animation-duration: 6s;" />

  <!-- Left Floating UI Pill / Metric Card -->
  <g class="floating-card-1" transform="translate(60, 48)">
    <rect width="190" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="28" cy="28" r="8" fill="#10b981" />
    <text x="44" y="32" class="card-title">Drag &amp; Drop Canvas</text>
    <rect x="22" y="46" width="146" height="6" rx="3" fill="#334155" />
    <rect x="22" y="46" width="98" height="6" rx="3" fill="#10b981" />
  </g>

  <!-- Right Floating Data Card -->
  <g class="floating-card-2" transform="translate(950, 48)">
    <rect width="190" height="80" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" />
    <circle cx="26" cy="26" r="6" fill="#8b5cf6" />
    <circle cx="42" cy="26" r="6" fill="#ec4899" />
    <circle cx="58" cy="26" r="6" fill="#3b82f6" />
    <text x="24" y="52" class="card-title">REST • SQL • GraphQL</text>
    <text x="24" y="68" class="tag" fill="#64748b">Instant CRUD &amp; RBAC</text>
  </g>

  <!-- Bottom Floating Workflow Node -->
  <g class="floating-card-1" transform="translate(960, 240)">
    <rect width="180" height="60" rx="10" fill="url(#cardGrad)" stroke="#475569" stroke-width="1" />
    <text x="20" y="27" class="card-title">⚡ Automation Workflows</text>
    <text x="20" y="45" class="tag">Self-Hosted &amp; Open Source</text>
  </g>

  <!-- MAIN FOREGROUND HERO CONTENT (Ensured clear, crisp, never covered) -->
  <g transform="translate(100, 160)">
    <!-- Pill Badge -->
    <g transform="translate(0, -6)">
      <rect width="320" height="30" rx="15" fill="url(#chipGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" class="tag">ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="66" class="title">Awesome Low-Code Internal Tools</text>

    <!-- Accent Gradient Bar -->
    <rect x="0" y="80" width="220" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="114" class="subtitle">Curated directory of platforms, admin builders, workflow engines &amp; self-hosted frameworks</text>
  </g>
</svg>